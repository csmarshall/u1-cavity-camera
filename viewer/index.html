const loader=new STLLoader();
const geo=b64=>{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const g=loader.parse(u.buffer);g.computeVertexNormals();return g};

const $=id=>document.getElementById(id);
const upd=()=>{const e=+$('ex').value;lid.position.z=e;mod.position.z=e*0.5;fov.position.z=9.6+H+e*0.5;
