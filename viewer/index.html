<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELP 16MP Camera Case – 3D Viewer</title>
<style>
:root{--bg:#f4f3ef;--fg:#1d1d1b;--mut:#6b6a66;--card:#fff;--line:#e2e0d9}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecebe6;--mut:#9c9a93;--card:#222220;--line:#34332f}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,sans-serif}
#v{position:fixed;inset:0}
.panel{position:fixed;left:12px;top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-width:290px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{font-size:15px;margin:0 0 2px}.sub{color:var(--mut);font-size:12px;margin-bottom:10px}
label{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
input[type=range]{width:100%}
.row{margin-top:8px}.k{color:var(--mut);font-size:12px}
.hint{position:fixed;right:12px;bottom:12px;color:var(--mut);font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{font:inherit;padding:4px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;margin:2px 4px 0 0}
.ov{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:16px;display:none;z-index:5}
.ov.on{display:block}.ov figure{margin:0 auto 18px;max-width:1400px}.ov img{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.ov figcaption{color:var(--mut);font-size:12px;margin-top:4px}.ov .close{position:sticky;top:0;float:right}
</style></head><body>
<div id="v"></div>
<div class="panel">
 <h1>ELP-USB16MP02-AF100 case</h1>
 <div class="sub">92 × 13.2 × 11.6 mm incl. heat-shrink nozzle · snap-fit lid</div>
 <label><input type="checkbox" id="tBase" checked><span class="sw" style="background:#4f7cac"></span>Base</label>
 <label><input type="checkbox" id="tLid" checked><span class="sw" style="background:#d98b3a"></span>Lid</label>
 <label><input type="checkbox" id="tMod" checked><span class="sw" style="background:#3c9a5f"></span>Camera (mock, assumed lens block)</label>
 <label><input type="checkbox" id="tFov"><span class="sw" style="background:#e04b4b"></span>Diagonal FOV cone (109°)</label>
 <div class="row"><span class="k">Explode</span><input type="range" id="ex" min="0" max="30" value="12"></div>
 <div class="row"><span class="k">Section cut (Y)</span><input type="range" id="cut" min="-7" max="7" step="0.1" value="7"></div>

 <div class="row"><button id="bRen">Review renders</button></div>
</div>

const el=document.getElementById('v');

r.setClearColor(dark?0x161615:0xf4f3ef);el.appendChild(r.domElement);
const s=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(35,1,0.5,2000);cam.up.set(0,0,1);
const ctl=new OrbitControls(cam,r.domElement);ctl.enableDamping=true;ctl.target.set(0,0,6);

const dl=new THREE.DirectionalLight(0xffffff,1.6);dl.position.set(60,-80,120);s.add(dl);
const dl2=new THREE.DirectionalLight(0xffffff,.6);dl2.position.set(-60,60,-40);s.add(dl2);
const grid=new THREE.GridHelper(120,24,dark?0x444444:0xbbbbbb,dark?0x2a2a2a:0xdddddd);grid.rotation.x=Math.PI/2;s.add(grid);
const clip=new THREE.Plane(new THREE.Vector3(0,-1,0),7);
const loader=new STLLoader();
const geo=b64=>{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const g=loader.parse(u.buffer);g.computeVertexNormals();return g};

const base=new THREE.Mesh(geo(DATA.base),mat(0x4f7cac));
const lid=new THREE.Mesh(geo(DATA.lid),mat(0xd98b3a));
const mod=new THREE.Mesh(geo(DATA.mod),mat(0x3c9a5f));

// FOV cone from lens top (z=9.6), half-angle 54.7 deg, 14 mm tall
const H=14,R=H*Math.tan(54.7*Math.PI/180)+1.5;
const cg=new THREE.ConeGeometry(R,H,48,1,true);cg.rotateX(-Math.PI/2);cg.translate(0,0,H/2);
const fov=new THREE.Mesh(cg,new THREE.MeshBasicMaterial({color:0xe04b4b,transparent:true,opacity:.18,side:THREE.DoubleSide,depthWrite:false}));
fov.rotation.x=Math.PI;fov.position.z=9.6+H;fov.visible=false;s.add(fov);
const $=id=>document.getElementById(id);
const upd=()=>{const e=+$('ex').value;lid.position.z=e;mod.position.z=e*0.5;fov.position.z=9.6+H+e*0.5;
 base.visible=$('tBase').checked;lid.visible=$('tLid').checked;mod.visible=$('tMod').checked;fov.visible=$('tFov').checked;clip.constant=+$('cut').value};
['tBase','tLid','tMod','tFov','ex','cut'].forEach(i=>$(i).addEventListener('input',upd));upd();
